name: Deploy App to Hostinger

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate API Clients
        env:
          VITE_API_BASE_URL: ${{ secrets.API_URL }}
          VITE_API_URL: ${{ secrets.API_URL }}/graphql
        run: |
          npx orval --config ./orval.config.ts
          npm run codegen

      - name: Build Project
        env:
          VITE_API_BASE_URL: ${{ secrets.API_URL }}
          VITE_REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
          VITE_REVERB_HOST: ${{ secrets.REVERB_HOST }}
          VITE_REVERB_PORT: ${{ secrets.REVERB_PORT }}
          VITE_REVERB_SCHEME: ${{ secrets.REVERB_SCHEME }}
        run: npm run build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./